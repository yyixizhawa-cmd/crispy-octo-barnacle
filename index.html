<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PitchOne 独立球衣站</title>
  <style>
    :root {
      --bg: #080b12;
      --panel: #101722;
      --panel-soft: #141d2b;
      --text: #f2f6ff;
      --muted: #9fb1cd;
      --primary: #44d2ff;
      --primary-strong: #00b7ff;
      --line: rgba(255, 255, 255, 0.12);
      --danger: #ff4f67;
      --ok: #31d38b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: radial-gradient(circle at 15% 10%, #1a2740 0%, #0c1220 35%, #060910 100%);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
      background: rgba(8, 11, 18, 0.8);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 16px var(--primary);
    }

    .cart-chip {
      border: 1px solid var(--line);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 14px;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 22px;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 18px 20px;
    }

    .hero {
      background: linear-gradient(125deg, rgba(68, 210, 255, 0.16), rgba(0, 0, 0, 0.45));
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 30px 24px;
      margin-bottom: 18px;
    }

    .hero h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 42px); }
    .hero p { margin: 0; color: var(--muted); }

    .pill-row {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 12px;
      color: #dbe7ff;
      font-size: 13px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--panel), var(--panel-soft));
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(68, 210, 255, 0.5);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .card-body { padding: 12px; }
    .team { margin: 0; font-weight: 700; }
    .meta { margin: 6px 0 10px; color: var(--muted); font-size: 13px; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .price {
      font-size: 18px;
      font-weight: 700;
    }

    button {
      border: none;
      background: linear-gradient(120deg, var(--primary), var(--primary-strong));
      color: #03212d;
      font-weight: 700;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .cart {
      border: 1px solid var(--line);
      background: rgba(10, 15, 25, 0.9);
      border-radius: 16px;
      padding: 16px;
      position: sticky;
      top: 76px;
      height: fit-content;
    }

    .cart h2 { margin: 0 0 10px; font-size: 20px; }

    .cart ul {
      margin: 0;
      padding-left: 18px;
      color: #d9e4fb;
      min-height: 90px;
    }

    .cart li { margin: 8px 0; }

    .summary {
      border-top: 1px solid var(--line);
      margin-top: 12px;
      padding-top: 12px;
      color: var(--muted);
    }

    .summary strong { color: var(--text); }

    .checkout {
      margin-top: 12px;
      width: 100%;
      background: linear-gradient(120deg, #39f4a3, var(--ok));
      color: #08321d;
    }

    .note {
      margin-top: 8px;
      font-size: 12px;
      color: #8193b0;
      text-align: center;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .cart { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> PitchOne · 独立球衣商店</div>
    <div class="cart-chip">🛒 已选 <span id="count">0</span> 件</div>
  </header>

  <main class="layout">
    <section>
      <div class="hero">
        <h1>Jersey Drop 2026</h1>
        <p>小众独立站 · 正版球衣 · 每周上新</p>
        <div class="pill-row">
          <span class="pill">全球直邮</span>
          <span class="pill">7天无理由</span>
          <span class="pill">支持球员印号</span>
        </div>
      </div>

      <div class="products" id="products"></div>
    </section>

    <aside class="cart">
      <h2>购物车</h2>
      <ul id="cartList"></ul>
      <div class="summary">
        总价：<strong>¥<span id="total">0</span></strong><br />
        运费：<strong>¥20</strong>
      </div>
      <button class="checkout">去结算</button>
      <div class="note">提示：此页面为演示版，订单不会真实提交。</div>
    </aside>
  </main>

  <script>
    const inventory = [
      { team: "阿根廷 主场 2026", price: 399, tag: "梅西同款", image: "https://images.unsplash.com/photo-1577212017184-80cc0da11082?auto=format&fit=crop&w=600&q=80" },
      { team: "法国 客场 2026", price: 389, tag: "姆巴佩印号", image: "https://images.unsplash.com/photo-1517927033932-b3d18e61fb3a?auto=format&fit=crop&w=600&q=80" },
      { team: "葡萄牙 主场 2026", price: 409, tag: "C罗纪念版", image: "https://images.unsplash.com/photo-1529900748604-07564a03e7a6?auto=format&fit=crop&w=600&q=80" },
      { team: "巴西 复古款", price: 359, tag: "1998 经典", image: "https://images.unsplash.com/photo-1570498839593-e565b39455fc?auto=format&fit=crop&w=600&q=80" }
    ];

    const productsEl = document.getElementById("products");
    const cartList = document.getElementById("cartList");
    const countEl = document.getElementById("count");
    const totalEl = document.getElementById("total");

    let cart = [];

    function renderProducts() {
      productsEl.innerHTML = inventory.map((item, idx) => `
        <article class="card">
          <img src="${item.image}" alt="${item.team}">
          <div class="card-body">
            <h3 class="team">${item.team}</h3>
            <p class="meta">${item.tag}</p>
            <div class="row">
              <span class="price">¥${item.price}</span>
              <button onclick="addToCart(${idx})">加入</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function addToCart(index) {
      cart.push(inventory[index]);
      renderCart();
    }

    function renderCart() {
      cartList.innerHTML = cart.map(item => `<li>${item.team} - ¥${item.price}</li>`).join("");
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      totalEl.textContent = total;
      countEl.textContent = cart.length;
    }

    renderProducts();
    renderCart();
  </script>
</body>
</html>
